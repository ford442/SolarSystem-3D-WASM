name: Native Linux build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libglew-dev libglfw3-dev libgl1-mesa-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libfreetype-dev libassimp-dev libglm-dev \
            xvfb

      - name: Build native binary
        run: ./build.sh

      - name: Build and run unit tests
        run: |
          rm -rf build-test
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOLARSYSTEM_BUILD_TESTS=ON -B build-test
          cmake --build build-test --target SolarSystemTests
          ctest --test-dir build-test --output-on-failure

      - name: Smoke test binary under Xvfb
        working-directory: ${{ github.workspace }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          timeout 12s xvfb-run -a ./build/SolarSystem > /tmp/solar-native.log 2>&1
          code=$?
          set -e
          cat /tmp/solar-native.log
          # Git ships placeholder DDS only; skybox load may abort after GL init.
          # 124 = still running at timeout. Any other exit is fine if GL came up.
          if ! grep -q "OpenGL version:" /tmp/solar-native.log; then
            echo "OpenGL did not initialize (exit ${code})"
            exit 1
          fi
