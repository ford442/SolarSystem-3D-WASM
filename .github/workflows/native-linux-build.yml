name: Native Linux build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A pull_request checkout is a merge commit; HEAD^1 (the base branch tip) is what the
          # changed-lines checks below diff against.
          fetch-depth: 2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libglew-dev libglfw3-dev libgl1-mesa-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libfreetype-dev libassimp-dev libglm-dev \
            xvfb ccache clang-format clang-tidy

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-native-${{ runner.os }}-

      - name: Check GL object ownership (no raw glGen*/glDelete* outside gfx/GlHandle.h)
        run: scripts/check-gl-handles.sh

      - name: Check source rules (no using-namespace in headers, no iostream logging)
        run: scripts/check-source-rules.sh

      - name: Format check (lines changed by this PR)
        if: github.event_name == 'pull_request'
        run: |
          # .clang-format captures the existing style; only touched lines are held to it, so
          # a PR is never asked to reformat a legacy file it happens to edit.
          if ! git clang-format --diff --extensions c,cpp,h,hpp HEAD^1 -- src tests tools > "$RUNNER_TEMP/clang-format.diff"; then
            cat "$RUNNER_TEMP/clang-format.diff"
            echo "::error::Run 'git clang-format origin/main' and commit the result."
            exit 1
          fi

      # SOLARSYSTEM_WERROR=ON: -Wall -Wextra warnings fail the build here, and only here.
      - name: Build native binary (CMake preset native-release)
        run: ./build.sh -DSOLARSYSTEM_WERROR=ON

      - name: clang-tidy (lines changed by this PR)
        if: github.event_name == 'pull_request'
        run: |
          # .clang-tidy makes cppcoreguidelines-owning-memory and misc-include-cleaner errors.
          # Older files still have ~1500 include-cleaner findings, so the check is held to the
          # lines this PR touches (clang-tidy-diff) rather than the whole tree. build/ has
          # compile_commands.json from the step above.
          git diff -U0 HEAD^1 -- 'src/*.cpp' ':!src/3rdparty' \
            | clang-tidy-diff -p1 -path build -quiet

      - name: Build and run unit tests (CMake preset native-tests)
        run: |
          rm -rf build-test
          cmake --preset native-tests
          cmake --build --preset native-tests
          ctest --preset native-tests

      - name: Run GL tests under Mesa (handles, programs, framebuffers, one draw)
        working-directory: ${{ github.workspace }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          # Without a display every test skips (and passes), so a skip fails the job.
          timeout 120s xvfb-run -a ./build-test/tests/SolarSystemGlTests 2>&1 | tee /tmp/solar-gl-tests.log
          grep -q "\[  PASSED  \]" /tmp/solar-gl-tests.log
          if grep -q "\[  SKIPPED \]" /tmp/solar-gl-tests.log; then
            echo "GL tests were skipped: no GL 4.6 context under Xvfb"
            exit 1
          fi

      - name: Compile every shader under Mesa (460 core and 300 es)
        working-directory: ${{ github.workspace }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          # Without this llvmpipe reports GL 4.6 but rejects `#version 460`.
          MESA_GLSL_VERSION_OVERRIDE: "460"
          SDL_AUDIODRIVER: dummy
          SOLARSYSTEM_SHADER_SELFTEST: "1"
        run: |
          timeout 120s xvfb-run -a ./build/SolarSystem 2>&1 | tee /tmp/solar-shaders.log
          grep -q "\[ShaderSelfTest\] .* OK" /tmp/solar-shaders.log

      - name: Smoke test binary under Xvfb
        working-directory: ${{ github.workspace }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          timeout 12s xvfb-run -a ./build/SolarSystem > /tmp/solar-native.log 2>&1
          code=$?
          set -e
          cat /tmp/solar-native.log
          # Git ships placeholder DDS only; skybox load may abort after GL init.
          # 124 = still running at timeout. Any other exit is fine if GL came up.
          if ! grep -q "OpenGL version:" /tmp/solar-native.log; then
            echo "OpenGL did not initialize (exit ${code})"
            exit 1
          fi
          if grep -qE "ERROR +\[Shader\]" /tmp/solar-native.log; then
            echo "A shader failed to compile or link"
            exit 1
          fi
