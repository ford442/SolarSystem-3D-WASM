<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System (Three.js / WebGPU companion)</title>
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive solar system companion (Sun to Pluto)"></canvas>
    <div
      id="loading-overlay"
      role="progressbar"
      aria-label="Loading solar system companion"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="loading-panel">
        <h2>Loading Solar System</h2>
        <div id="loading-bar-track"><div id="loading-bar"></div></div>
        <p id="loading-percent">0%</p>
        <p id="loading-detail">Starting renderer…</p>
      </div>
    </div>
    <section class="hud" aria-label="Companion renderer controls">
      <h1 id="companion-title">Solar System · Companion</h1>
      <p id="info">Initializing renderer…</p>
      <p id="texture-status">Preparing KTX2 textures…</p>
      <p class="hint">Drag to orbit · wheel to zoom · WASD + Space/C to glide</p>
      <nav id="focus-presets" aria-label="Camera focus presets"></nav>
      <button id="music-toggle" type="button" aria-pressed="false">♪ Music off</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
