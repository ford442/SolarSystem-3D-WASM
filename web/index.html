<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SolarSystem WASM</title>
    <style>
      body { margin: 0; overflow: hidden; background-color: black; touch-action: none; overscroll-behavior: none; }
      html { touch-action: none; overscroll-behavior: none; }
      canvas.emscripten { border: 0px none; background-color: black; width: 100vw; height: 100vh; display: block; touch-action: none; }
      
      #loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-family: Arial, sans-serif;
      }
      
      #loading-text {
        color: #ffffff;
        font-size: 24px;
        margin-bottom: 30px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      
      #progress-bar-container {
        width: 400px;
        height: 30px;
        background-color: #333;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        border: 2px solid #555;
      }
      
      #progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4CAF50, #45a049);
        width: 0%;
        transition: width 0.3s ease;
        box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
      }
      
      #progress-text {
        color: #ffffff;
        font-size: 18px;
        margin-top: 15px;
        font-weight: bold;
      }
      
      #streaming-progress {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #4dd9f0;
        font-family: Arial, sans-serif;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(77, 217, 240, 0.5);
        z-index: 999;
        min-width: 180px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      }
      #streaming-progress-bar-container {
        width: 100%;
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 4px;
        border: 1px solid #333;
      }
      #streaming-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4dd9f0, #2aa8d8);
        width: 0%;
        transition: width 0.2s ease;
      }
      #streaming-text {
        font-size: 12px;
        white-space: nowrap;
      }
      
      #loading-container.hidden {
        display: none;
        pointer-events: none;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="loading-container">
      <div id="loading-text">Loading SolarSystem...</div>
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-text">0%</div>
    </div>
    <div id="streaming-progress">
      <div id="streaming-text"></div>
      <div id="streaming-progress-bar-container">
        <div id="streaming-progress-bar"></div>
      </div>
    </div>
    <aside id="explorer-panel" class="explorer-panel" aria-label="Solar system explorer">
      <button
        id="explorer-toggle"
        class="explorer-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="explorer-controls"
      >
        <span>Explorer</span>
        <span class="explorer-toggle-icon" aria-hidden="true">−</span>
      </button>
      <div id="explorer-controls" class="explorer-controls">
        <label class="explorer-row" for="orbit-scale-mode">
          <span>Orbit scale</span>
          <select id="orbit-scale-mode">
            <option value="0">Compressed</option>
            <option value="1">Realistic</option>
          </select>
        </label>
        <small id="orbit-scale-help" class="explorer-help">
          Artistic spacing for navigation — all worlds stay within a few thousand scene units.
        </small>

        <div id="explorer-body-list" class="explorer-body-list" role="listbox" aria-label="Celestial bodies"></div>

        <article id="planet-info-card" class="planet-info-card" hidden>
          <h2 id="planet-info-title" class="planet-info-title">Earth</h2>
          <p id="planet-info-summary" class="planet-info-summary"></p>
          <dl id="planet-info-facts" class="planet-info-facts"></dl>
        </article>

        <p id="explorer-status" class="explorer-status" aria-live="polite">Loading facts…</p>
      </div>
    </aside>
    <aside id="settings-panel" class="settings-panel" aria-label="Simulation settings">
      <button
        id="settings-toggle"
        class="settings-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="settings-controls"
      >
        <span>Simulation</span>
        <span class="settings-toggle-icon" aria-hidden="true">−</span>
      </button>
      <div id="settings-controls" class="settings-controls">
        <fieldset id="settings-fieldset" disabled>
          <label class="settings-row" for="quality-preset">
            <span>Quality</span>
            <select id="quality-preset">
              <option value="0">Low</option>
              <option value="1">Medium</option>
              <option value="2">Full</option>
            </select>
          </label>

          <label class="settings-row" for="simulation-date">
            <span>Simulation date</span>
            <input id="simulation-date" type="date" min="1800-01-01" max="2050-12-31" />
          </label>
          <div class="settings-date-actions">
            <button id="simulation-date-set" class="settings-date-btn" type="button">Set date</button>
            <button id="simulation-date-now" class="settings-date-btn" type="button">Now</button>
          </div>
          <small id="simulation-date-help">Heliocentric positions from Julian date (Standish approx.)</small>

          <label class="settings-slider" for="time-scale">
            <span>Time scale</span>
            <output id="time-scale-value" for="time-scale">1×</output>
          </label>
          <input
            id="time-scale"
            type="range"
            min="-2"
            max="4"
            step="0.05"
            value="0"
            aria-describedby="time-scale-help"
          />
          <small id="time-scale-help">Log scale: 0.01× to 10,000×</small>

          <label class="settings-switch" for="simulation-paused">
            <span>Pause animation</span>
            <input id="simulation-paused" type="checkbox" />
          </label>

          <label class="settings-switch" for="shadows-enabled">
            <span>Shadows</span>
            <input id="shadows-enabled" type="checkbox" checked />
          </label>

          <label class="settings-switch" for="orbit-lines-enabled">
            <span>Orbit lines</span>
            <input id="orbit-lines-enabled" type="checkbox" checked />
          </label>

          <label class="settings-slider" for="music-volume">
            <span>Music volume</span>
            <output id="music-volume-value" for="music-volume">30%</output>
          </label>
          <input
            id="music-volume"
            type="range"
            min="0"
            max="100"
            step="1"
            value="30"
            aria-describedby="music-volume-help"
          />
          <small id="music-volume-help">Background music from hosted MP3 assets</small>

          <label class="settings-switch" for="music-muted">
            <span>Mute music</span>
            <input id="music-muted" type="checkbox" />
          </label>

          <button id="settings-reset" class="settings-reset" type="button">Reset settings</button>
          <button id="enter-vr" class="settings-vr" type="button" hidden>Enter VR</button>
          <button id="exit-vr" class="settings-vr settings-vr-exit" type="button" hidden>Exit VR</button>
        </fieldset>
        <p id="settings-status" class="settings-status" aria-live="polite">Initializing controls…</p>
      </div>
    </aside>
    <div id="touch-controls" class="touch-controls" hidden>
      <div id="touch-joystick-zone" class="touch-joystick-zone" aria-hidden="true"></div>
      <div id="touch-joystick-base" class="touch-joystick-base" aria-hidden="true"></div>
      <div id="touch-joystick-knob" class="touch-joystick-knob" aria-hidden="true"></div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
