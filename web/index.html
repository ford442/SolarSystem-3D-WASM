<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolarSystem WASM</title>
    <style>
      body { margin: 0; overflow: hidden; background-color: black; }
      canvas.emscripten { border: 0px none; background-color: black; width: 100vw; height: 100vh; display: block; }
      
      #loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-family: Arial, sans-serif;
      }
      
      #loading-text {
        color: #ffffff;
        font-size: 24px;
        margin-bottom: 30px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      
      #progress-bar-container {
        width: 400px;
        height: 30px;
        background-color: #333;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        border: 2px solid #555;
      }
      
      #progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4CAF50, #45a049);
        width: 0%;
        transition: width 0.3s ease;
        box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
      }
      
      #progress-text {
        color: #ffffff;
        font-size: 18px;
        margin-top: 15px;
        font-weight: bold;
      }
      
      #streaming-progress {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #4dd9f0;
        font-family: Arial, sans-serif;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(77, 217, 240, 0.5);
        z-index: 999;
        min-width: 180px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      }
      #streaming-progress-bar-container {
        width: 100%;
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 4px;
        border: 1px solid #333;
      }
      #streaming-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4dd9f0, #2aa8d8);
        width: 0%;
        transition: width 0.2s ease;
      }
      #streaming-text {
        font-size: 12px;
        white-space: nowrap;
      }
      
      #loading-container.hidden {
        display: none;
        pointer-events: none;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="loading-container">
      <div id="loading-text">Loading SolarSystem...</div>
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-text">0%</div>
    </div>
    <div id="streaming-progress">
      <div id="streaming-text"></div>
      <div id="streaming-progress-bar-container">
        <div id="streaming-progress-bar"></div>
      </div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
